#version: '3.8'

services:

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"

  main-app:
    build:
      context: ./main-app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      REDIS_ENABLED: false
      ACTIVEMQ_ENABLED: false
      POSTGRES_ENABLED: false
    restart: always
    depends_on:
      - eureka-server

  trainer-workload-service:
    build:
      context: ./trainer-workload-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      REDIS_ENABLED: false
      ACTIVEMQ_ENABLED: false
      POSTGRES_ENABLED: false
    restart: always
    depends_on:
      - eureka-server
