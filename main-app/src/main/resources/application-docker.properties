# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/gymcrm
spring.datasource.username=postgres
spring.datasource.password=1
#spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/gymcrm # used without integrating into docker

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
#spring.data.redis.host=host.docker.internal # used without integrating into docker

# Active MQ
spring.activemq.broker-url=tcp://activemq:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.pub-sub-domain=false
#spring.activemq.broker-url=tcp://host.docker.internal:61616 # used without integrating into docker

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true

# Circuit Breaker
resilience4j.circuitbreaker.instances.workloadService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.workloadService.sliding-window-size=10
resilience4j.circuitbreaker.instances.workloadService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.workloadService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.workloadService.permitted-number-of-calls-in-half-open-state=3