# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/trainerdb
spring.datasource.username=postgres
spring.datasource.password=1
#spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/trainerdb # used without integrating into docker


# MongoDB
spring.data.mongodb.uri=mongodb://mongo:27017/trainer-workload-db
#spring.data.mongodb.host=host.docker.internal # used without integrating into docker


# Active MQ
spring.activemq.broker-url=tcp://activemq:61616
spring.activemq.user=admin
spring.activemq.password=admin
#spring.activemq.broker-url=tcp://host.docker.internal:61616 # used without integrating into docker

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
#eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka # used without integrating into docker



