
#spring.datasource.url=jdbc:postgresql://localhost:5432/trainerdb
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/trainerdb

spring.datasource.username=postgres
spring.datasource.password=1
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

#Eureka

spring.application.name=trainer-workload-service

#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


#Active MQ
# ActiveMQ broker
#spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.broker-url=tcp://host.docker.internal:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.activemq.packages.trust-all=true

# We use queues, not topics
spring.jms.pub-sub-domain=false


# MongoDB
#spring.data.mongodb.host=localhost
spring.data.mongodb.host=host.docker.internal
spring.data.mongodb.port=27017
spring.data.mongodb.database=trainer-workload-db

